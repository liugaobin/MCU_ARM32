version: "4.1"
name: GD32F407
type: ARM
deviceName: GD32F407IE
packDir: .pack/GigaDevice/GD32F4xx_DFP.2.0.0
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
