        - path: ../Firmware/CMSIS/GD/GD32F4xx/Source/ARM/startup_gd32f407_427.s
        - path: ../Firmware/CMSIS/GD/GD32F4xx/Source/system_gd32f4xx.c
      folders: []
    - name: Firmware
      files:
        - path: ../Firmware/GD32F4xx_standard_peripheral/Source/gd32f4xx_gpio.c
        - path: ../Firmware/GD32F4xx_standard_peripheral/Source/gd32f4xx_rcu.c
        - path: ../Firmware/GD32F4xx_standard_peripheral/Source/gd32f4xx_misc.c
        - path: ../Firmware/GD32F4xx_standard_peripheral/Source/gd32f4xx_usart.c
      folders: []
    - name: Hardware
      files: []
      folders: []
    - name: Doc
      files:
        - path: ../Doc/readme.txt
      folders: []
    - name: Driver
      files:
        - path: ../Driver/bsp_led.c
        - path: ../Driver/bsp_key.c
      folders: []
    - name: Middleware
      files: []
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: b4f6c4e62dc303a1300e907c8a3bb704
targets:
  Target 1:
    cppPreprocessAttrs:
      defineList:
        - USE_STDPERIPH_DRIVER
        - GD32F407
      incList:
        - .
        - ../User
        - ../Firmware/CMSIS/GD/GD32F4xx/Include
        - ../Firmware/GD32F4xx_standard_peripheral/Include
        - ../Firmware/CMSIS
        - .cmsis/include
        - RTE/_Target 1
        - ../Driver
        - ../Hardware
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
            defines: []
            misc-controls: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++03
            link-time-optimization: false
            one-elf-section-per-function: true
            optimization: level-1
            short-enums#wchar: true
            warnings: ac5-like-warnings
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $outputTaskExcludes:
              - .bin
            misc-controls: --diag_suppress=L6329
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
            xo-base: ""
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 3
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: false
              mem:
                size: "0x10000"
                startAddr: "0x10000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 3
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x80000"
                startAddr: "0x8000000"
              tag: IROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: D:/APP/GD-Link Programmer/GD-Link Programmer.exe -p GD32F407 -f "${HEX_FILE}" -v -r
        eraseChipCommand: ""
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: stlink
        target: stm32f1x
      STLink:
        address: "0x8000000"
        bin: ""
        elFile: None
        optionBytes: .eide/target 1.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/target 1.pyocd.yaml
        otherCmds: ""
        speed: 4M
        targetName: gd32f407ve
    uploader: pyOCD
